<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奥武蔵ウルトラマラソン70km</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f5f7f8}body{margin:0;padding:16px}.wrap{max-width:720px;margin:auto}.hero,.card{background:#fff;border:1px solid #dfe5e8;border-radius:16px;padding:16px;margin-bottom:14px}.hero h1{font-size:22px;margin:0 0 10px}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#eef3f5;border-radius:999px;padding:8px 12px;font-weight:700}.result{text-align:center}.result .time{font-size:42px;font-weight:800;margin:6px 0}.ok{color:#16734a}.late{color:#b42318}.muted{color:#65727c;font-size:14px}.row{display:grid;grid-template-columns:72px 1fr 118px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #edf0f2}.row:last-child{border-bottom:0}.km{font-weight:800}.place{min-width:0}.place small{display:block;color:#65727c}select{box-sizing:border-box;font-size:16px;padding:10px 6px;border:1px solid #b9c2c8;border-radius:10px;background:white}.time24{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center}.time24 span{font-weight:800}button{min-height:44px;border:0;border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700;cursor:pointer}.clear{background:#e9eef1;color:#27343c;width:100%;margin-top:12px}.hint{font-size:13px;color:#65727c;margin:8px 0 0}@media(max-width:420px){body{padding:10px}.row{grid-template-columns:60px 1fr 108px}.result .time{font-size:36px}}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#075f3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="奥武蔵ウルトラマラソン70km">
</head>
<body>
<main class="wrap">
<section class="hero">
<h1>奥武蔵ウルトラマラソン70km</h1>
<div class="meta"><span class="pill">スタート 7:00</span><span class="pill">ゴール関門 18:00</span></div>
<p class="hint">通過したエイドの到着時刻を入力してください。最も距離が進んだ入力地点までの平均ペース（休憩込み）で、70kmの予測ゴール時刻を計算します。</p>
</section>
<section class="card result" aria-live="polite">
<div class="muted">予測ゴール時刻</div><div id="goal" class="time">--:--</div><div id="status" class="muted">エイドの到着時刻を入力してください</div>
</section>
<section class="card" id="aidList"></section>
<button id="clear" class="clear" type="button">入力をすべてクリア</button>
</main>
<script>
(()=>{
const aids=[
[4.2,'阿諏訪AS①'],[8.8,'滝ノ入AS①'],[13.8,'桂木AS'],[17.6,'滝ノ入AS②'],[22.2,'阿諏訪AS②'],
[23.5,'鎌北湖第2駐車場','関門 10:35'],[25.5,'清流AS①'],[28.2,'ユガテAS①'],[31.1,'黒山AS①'],[35.5,'阿寺AS①'],
[36.8,'見晴台AS①'],[38.9,'高山AS①'],[42.0,'飯盛AS①'],[45.4,'刈場坂AS','関門 14:10／折返し'],[48.7,'飯盛AS②'],
[51.8,'高山AS②','関門 15:00'],[53.9,'見晴台AS②'],[57.2,'阿寺AS②'],[59.6,'黒山AS②'],[62.5,'ユガテAS②','関門 16:50'],[65.2,'清流AS②','関門 17:20']
];
const start=7*60, cutoff=18*60, total=70;
const list=document.getElementById('aidList');
aids.forEach((a,i)=>{const r=document.createElement('div');r.className='row';
let ho='<option value="">時</option>',mo='<option value="">分</option>';
for(let h=0;h<24;h++){const v=String(h).padStart(2,'0');ho+=`<option value="${v}">${v}</option>`}
for(let m=0;m<60;m++){const v=String(m).padStart(2,'0');mo+=`<option value="${v}">${v}</option>`}
r.innerHTML=`<div class="km">${a[0].toFixed(1)} km</div><div class="place">${a[1]}${a[2]?`<small>${a[2]}</small>`:''}</div><div class="time24" data-km="${a[0]}"><select class="hh" aria-label="${a[1]} 到着時">${ho}</select><span>:</span><select class="mm" aria-label="${a[1]} 到着分">${mo}</select></div>`;list.appendChild(r)});
const inputs=[...list.querySelectorAll('.time24')], goal=document.getElementById('goal'), status=document.getElementById('status');
function fmt(m){m=Math.round(m);m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function calc(){let best=null;for(const el of inputs){const hv=el.querySelector('.hh').value,mv=el.querySelector('.mm').value;if(hv===''||mv==='')continue;const mins=Number(hv)*60+Number(mv),km=Number(el.dataset.km);if(mins<=start)continue;if(!best||km>best.km)best={km,mins}}if(!best){goal.textContent='--:--';goal.className='time';status.textContent='エイドの到着時刻を入力してください';return}const elapsed=best.mins-start;const pace=elapsed/best.km;const predicted=start+pace*total;goal.textContent=fmt(predicted);const diff=cutoff-predicted;goal.className='time '+(diff>=0?'ok':'late');const paceMin=Math.floor(pace),paceSec=Math.round((pace-paceMin)*60);status.textContent=(diff>=0?`18:00まで約${Math.round(diff)}分の余裕`:`18:00を約${Math.round(-diff)}分超過する予測`)+` ／ 平均 ${paceMin}:${String(paceSec).padStart(2,'0')}/km`}
inputs.forEach(x=>x.querySelectorAll('select').forEach(s=>s.addEventListener('change',calc)));document.getElementById('clear').addEventListener('click',()=>{inputs.forEach(x=>x.querySelectorAll('select').forEach(s=>s.value=''));calc()});calc();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
 window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(r=>r.update()).catch(console.error));
}
</script>
</body>
</html>
